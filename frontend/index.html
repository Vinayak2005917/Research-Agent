<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Agent — Setup</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <h2>Welcome</h2>
    <p class="sub">Enter your name so that we can retrieve your previous sessions.</p>

    <label for="username">Your name</label>
    <input type="text" id="username" autocomplete="off" placeholder="e.g. alice">

    <label>Documents</label>
    <div id="fileDrop" class="file-drop">Click or drag &amp; drop files here<br>
      <small>(pdf, txt, md, docx, csv, xlsx, json)</small>
    </div>
    <input type="file" id="fileInput" multiple hidden
           accept=".pdf,.txt,.md,.docx,.csv,.xlsx,.json">
    <div id="fileList"></div>

    <button id="startBtn" disabled>Start Session</button>

    <div id="progressWrap">
      <div id="progressLabel"></div>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
