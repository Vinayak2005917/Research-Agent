<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Agent</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>

<header>
  <h1 style="display:none">Research Agent</h1>
  <span id="status">connecting...</span>
  <div class="header-actions">
    <button id="filesBtn" type="button" title="View uploaded files">📁 My Files</button>
    <button id="uploadBtn" type="button" title="Upload new files">⬆ Upload</button>
    <input type="file" id="chatFileInput" multiple hidden
           accept=".pdf,.txt,.md,.docx,.csv,.xlsx,.json">
  </div>
</header>

<div id="filesPanel" class="hidden">
  <div class="files-panel-card">
    <div class="files-panel-head">
      <strong>Your uploaded files</strong>
      <button id="closeFilesBtn" type="button" title="Close">✕</button>
    </div>
    <ul id="filesList"><li class="empty">Loading…</li></ul>
  </div>
</div>

<div id="chat"></div>

<div id="examples">
  <button class="example" type="button">what is most recent exoplanet found</button>
  <button class="example" type="button">what is the nancy grace rooman telescope</button>
  <button class="example" type="button">what is an exoplanet</button>
</div>

<form id="form">
  <input id="input" autocomplete="off" placeholder="Ask a research question...">
  <button id="send">Send</button>
</form>

<script src="chat.js"></script>
</body>
</html>
